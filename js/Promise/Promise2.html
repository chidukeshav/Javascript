<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 100px;
            height: 300px;
        }
        #products{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            row-gap: 10px;
            
        }
        .product{
            border: 1px solid;
            height: 400px;
            width: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0px 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 6px black;
            overflow: hidden;
            background-color:  rgb(230, 232, 223);
            transition: all 1s;


        }
        .product:hover{
            transition: scale(1.01);
        }
        img{
            transition: all 1s;
        }
        img:hover{
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <div id="products"> </div>
    <script>
            let products =document.getElementById("products")
            let myPromise=new Promise((resolve,reject)=>{
            let data=fetch('https://fakestoreapi.com/products')
            data.then((res)=>{
                res.json().then((d)=>{
                    resolve(d)
                })

            }).catch((err)=>{
                reject("Something went wrong")
    
        })
        })
        myPromise.then((data)=>{
            products.innerHTML=data.map((ele)=>{
               return `
               <div class='product'>
                 <h1>${ele.title.slice(0,10)}</h1>
               <img src=${ele.image} height="200px">
               <p>${ele.description.slice(0,100)}</p>
                <h3>${ele.price}</h3>
                <h3>${ele.category}</h3>
                </div>
                    `

            
        })
    })

    </script>
</body>
</html>
