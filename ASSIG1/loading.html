<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="sub()">-</button>
    <h1 id="h"></h1>
    <button onclick="add()">+</button>
    <script>
        let c = 0
        let h = document.getElementById("h")
        h.innerText=c

        function add() {
            c++
            h.innerText = c
        }
        function sub() {
            if (c == 0) {

                return;
            }
            c--
            h.innerText = c

        }
    </script>
</body>

</html>
